name: Android app

on:
  push:
    paths: ["android/**", "oneplus_cleanup.bat", "tools/gen_app_catalog.py", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "oneplus_cleanup.bat", "tools/gen_app_catalog.py", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Catalog is in sync with the script
        working-directory: .
        run: python3 tools/gen_app_catalog.py && git diff --exit-code android/app/src/main/assets/catalog.json
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: oneplus-cleanup-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
